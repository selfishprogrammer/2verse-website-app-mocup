  --accent:#c0704f;--accent-strong:#98512f;--on-accent:#fffdf9;

  --soft-sage:#e8eee5;--soft-clay:#f5e3da;--soft-gold:#f4ead6;--soft-sky:#e6eff3;
  --deep:#1e3a3e;--deep-ink:#fffdf9;--danger:#b3261e;
  --orb-1:#c0704f;--orb-2:#e8c27e;--orb-3:#2f5358;
  --chart-1:#00918a;--chart-2:#bf5f37;
  --shadow-sm:0 2px 10px rgba(30,58,62,.06);--shadow-md:0 14px 40px -12px rgba(30,58,62,.2);--shadow-lg:0 30px 80px -20px rgba(30,58,62,.32);

  --bg:#F7F4EE;--bg-alt:#EEE9DF;--surface:#FFFFFF;--surface-2:#F7F4EE;
  --ink:#141414;--ink-2:#4B4945;--muted:#706c66;--line:rgba(20,20,20,.1);--line-strong:#93918e;
  --primary:#141414;--primary-deep:#000000;--on-primary:#F7F4EE;
  --accent:#B08D57;--accent-strong:#7f663f;--on-accent:#FFFFFF;
  --gold:#B08D57;--gold-strong:#7b633d;
  --soft-sage:#EFEBE3;--soft-clay:#F3EDE2;--soft-gold:#F1E9D8;--soft-sky:#ECEAE6;
  --deep:#141414;--deep-ink:#F7F4EE;--danger:#b3261e;

}

  --bg:#120B1F;--bg-alt:#180F29;--surface:#1D1330;--surface-2:#251A3D;
  --ink:#F5EEF7;--ink-2:#C7B9D2;--muted:#9284a4;--line:rgba(255,255,255,.08);--line-strong:#6d6675;
  --primary:#edbba5;--primary-deep:#D9A088;--on-primary:#120B1F;
  --accent:#B98CFF;--accent-strong:#b98cff;--on-accent:#120B1F;
  --gold:#E8C08E;--gold-strong:#e8c08e;
  --soft-sage:#2A1D45;--soft-clay:#34203F;--soft-gold:#2E2336;--soft-sky:#221F48;
  --deep:#0B0614;--deep-ink:#F5EEF7;--danger:#ff8a80;
  --orb-1:#9E6BF0;--orb-2:#F2C6B4;--orb-3:#2A1260;
  --chart-1:#edbba5;--chart-2:#b98cff;
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);--shadow-md:0 14px 40px -12px rgba(0,0,0,.55);--shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
}
[data-theme="moonlit"]{
  --bg:#07161A;--bg-alt:#0B1E23;--surface:#0F262C;--surface-2:#143038;
  --ink:#EAF4F2;--ink-2:#A9C2C0;--muted:#809a98;--line:rgba(255,255,255,.08);--line-strong:#657273;
  --primary:#9fe3d6;--primary-deep:#7FCABC;--on-primary:#07161A;
  --accent:#F0A868;--accent-strong:#f0a868;--on-accent:#07161A;
  --gold:#E3CB92;--gold-strong:#e3cb92;
  --soft-sage:#12323A;--soft-clay:#2A2A24;--soft-gold:#223029;--soft-sky:#123041;
  --deep:#040E11;--deep-ink:#EAF4F2;--danger:#ff8a80;
  --orb-1:#3FB8A8;--orb-2:#F3DFB0;--orb-3:#0B3440;

  --shadow-sm:0 2px 10px rgba(0,0,0,.3);--shadow-md:0 14px 40px -12px rgba(0,0,0,.55);--shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
}
[data-theme="aurora"]{
  --bg:#06110F;--bg-alt:#0A1916;--surface:#0E1F1B;--surface-2:#132924;
  --ink:#ECF5F0;--ink-2:#A8C2B8;--muted:#7a938a;--line:rgba(255,255,255,.08);--line-strong:#626c69;
  --primary:#7cf0c2;--primary-deep:#5FD8A9;--on-primary:#06110F;
  --accent:#C59BFF;--accent-strong:#c59bff;--on-accent:#06110F;
  --gold:#E4D08A;--gold-strong:#e4d08a;
  --soft-sage:#12302A;--soft-clay:#241F3D;--soft-gold:#262B22;--soft-sky:#10283A;
  --deep:#030A08;--deep-ink:#ECF5F0;--danger:#ff8a80;
  --orb-1:#2FD49A;--orb-2:#C59BFF;--orb-3:#0B2E3A;
  --chart-1:#7cf0c2;--chart-2:#c59bff;
  --shadow-sm:0 2px 10px rgba(0,0,0,.3);--shadow-md:0 14px 40px -12px rgba(0,0,0,.55);--shadow-lg:0 30px 80px -20px rgba(0,0,0,.7);
}
:root{--font-display:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;--font-sans:Poppins,system-ui,-apple-system,"Segoe UI",sans-serif;
  --radius-sm:10px;--radius-md:18px;--radius-lg:28px;--radius-pill:999px;--ease:cubic-bezier(.22,.61,.36,1)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:15px;line-height:1.5;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;transition:background .5s,color .5s}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--font-display);font-weight:500;letter-spacing:-.01em;line-height:1.15}
em{font-style:italic;color:var(--accent)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:6px}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.i.s{width:16px;height:16px}.i.xs{width:13px;height:13px}
.i.f{fill:currentColor;stroke:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}

/* ===== shell ===== */
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 16px;gap:4px;overflow-y:auto;z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:23px;color:var(--primary);padding:0 10px 14px}
.logo .v{color:var(--accent)}
.logo small{font-family:var(--font-sans);font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-strong);background:var(--soft-clay);padding:3px 7px;border-radius:6px;margin-left:2px}
.nav-l{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:12px 12px 4px}
.nav{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:12px;color:var(--ink-2);font-weight:500;font-size:14.5px;transition:background .2s,color .2s;width:100%;text-align:left}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav.on{background:var(--primary);color:var(--on-primary)}
.cnt{margin-left:auto;font-size:11.5px;font-weight:700;min-width:22px;height:22px;padding:0 6px;border-radius:99px;display:grid;place-items:center;background:var(--soft-clay);color:var(--accent-strong)}
.nav.on .cnt{background:rgba(255,255,255,.2);color:inherit}
.side-foot{margin-top:auto;padding-top:14px}
.link-card{border-radius:18px;padding:14px;background:var(--deep);color:var(--deep-ink)}
.link-card b{display:block;font-size:13.5px}
.link-card small{font-size:12px;opacity:.75;display:block;margin:2px 0 10px}
.link-card .url{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border-radius:10px;padding:7px 10px;font-size:12.5px}
.link-card .url button{margin-left:auto;color:var(--gold);font-weight:600;font-size:12px}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:16px 32px;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.search{flex:1;max-width:420px;display:flex;align-items:center;gap:10px;height:44px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:14px}
.search input{border:none;background:none;outline:none;flex:1;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.avail{display:flex;align-items:center;gap:10px;height:44px;padding:0 8px 0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;font-weight:600}
.avail .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.avail.on .dot{background:#2e9e6b;box-shadow:0 0 0 4px rgba(46,158,107,.18)}
.tg{width:44px;height:26px;border-radius:99px;background:var(--line-strong);position:relative;transition:.25s;flex-shrink:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.25s var(--ease)}
.tg[aria-checked="true"]{background:var(--primary)}
.tg[aria-checked="true"]::after{transform:translateX(18px)}
.ib{width:44px;height:44px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;position:relative;color:var(--ink-2);flex-shrink:0}
.ib:hover{color:var(--ink)}
.ib.menu-btn{display:none}
.ib .dn{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--accent);border:2px solid var(--surface)}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 4px;border-radius:14px;position:relative}
.me b{font-size:13.5px;display:block;line-height:1.2}.me small{font-size:12px;color:var(--muted)}
.me-menu{position:absolute;right:0;top:calc(100% + 8px);width:220px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-md);padding:6px;display:none;z-index:40}
.me-menu.open{display:block}
.me-menu button{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:10px;font-size:14px;text-align:left}
.me-menu button:hover{background:var(--surface-2)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fffdf9;font-family:var(--font-display);font-size:17px;flex-shrink:0;background:var(--primary-deep)}
.av.s{width:32px;height:32px;font-size:13.5px}.av.l{width:56px;height:56px;font-size:22px}.av.xl{width:84px;height:84px;font-size:32px}

.content{padding:28px 32px 70px;max-width:1440px;width:100%;margin:0 auto}
.view{display:none;animation:fadeUp .45s var(--ease)}
.view.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:22px}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-strong)}
.eyebrow::before{content:"";width:24px;height:1px;background:currentColor}
.head h1{font-size:38px;margin-top:8px}
.head p{color:var(--ink-2);margin-top:6px;max-width:720px}
.head-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ===== components ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:var(--radius-pill);font-weight:600;font-size:14px;border:1px solid transparent;transition:transform .2s var(--ease),background .2s,opacity .2s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.p{background:var(--primary);color:var(--on-primary)}.btn.p:hover{background:var(--primary-deep)}
.btn.a{background:var(--accent-strong);color:var(--on-accent)}
.btn.g{background:var(--surface);border-color:var(--line-strong);color:var(--primary)}
.btn.t{color:var(--muted);padding:0 10px}
.btn.d{background:var(--surface);border-color:var(--danger);color:var(--danger)}
.btn.dd{background:var(--danger);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.xs{height:28px;padding:0 10px;font-size:12px;gap:5px}
.btn.gold{background:var(--gold);color:#1d2a2c}
.icon-btn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.icon-btn:hover{color:var(--ink);background:var(--surface-2)}
.icon-btn.danger:hover{color:var(--danger)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow-sm);padding:22px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card-h h2{font-size:21px}
.card-h .lnk{font-size:13px;font-weight:600;color:var(--accent-strong)}
.card-h small{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:var(--radius-sm);font-size:12px;font-weight:600;line-height:16px;white-space:nowrap}
.pill .i{width:13px;height:13px}
.pill.ok{background:var(--soft-sage);color:var(--primary)}
.pill.rev{background:var(--soft-gold);color:var(--gold-strong)}
.pill.act{background:var(--soft-clay);color:var(--accent-strong)}
.pill.sky{background:var(--soft-sky);color:var(--ink-2)}
.pill.done{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.bad{background:var(--soft-clay);color:var(--danger)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;flex-wrap:wrap}
.seg button{height:32px;padding:0 13px;border-radius:9px;font-size:13px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--surface);color:var(--primary);font-weight:600;box-shadow:var(--shadow-sm)}
.seg .n{font-size:11px;font-weight:700;background:var(--line);padding:1px 6px;border-radius:99px}
.muted{color:var(--muted)}.small{font-size:13px}
.empty{text-align:center;padding:34px 14px;color:var(--muted);font-size:14px}
.empty .i{width:28px;height:28px;margin:0 auto 8px;display:block;color:var(--line-strong)}
.divider{height:1px;background:var(--line);margin:16px 0}

/* forms */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field > span{font-size:13px;font-weight:600;color:var(--ink)}
.field small{font-size:12px;color:var(--muted);font-weight:400}
.inp,.sel,.ta{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:14px;color:var(--ink);outline:none;transition:border .2s,box-shadow .2s}
.ta{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.inp:focus,.sel:focus,.ta:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--soft-sage)}
.sel{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.fgrid .full{grid-column:1/-1}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{cursor:pointer}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:99px;border:1px solid var(--line-strong);font-size:13.5px;font-weight:500;background:var(--surface);transition:.2s}
.choice input:checked + span{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.choice input:focus-visible + span{outline:2px solid var(--primary);outline-offset:2px}
.choice input:disabled + span{opacity:.45;cursor:not-allowed}
.drop{border:1.5px dashed var(--line-strong);border-radius:16px;padding:18px;display:flex;align-items:center;gap:14px;cursor:pointer;background:var(--surface-2);transition:border .2s}
.drop:hover{border-color:var(--primary)}
.drop input{display:none}
.drop .dz-ic{width:44px;height:44px;border-radius:12px;background:var(--surface);display:grid;place-items:center;color:var(--primary);flex-shrink:0;overflow:hidden}
.drop .dz-ic img{width:100%;height:100%;object-fit:cover}
.drop b{font-size:14px;display:block}.drop small{font-size:12.5px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.check input{width:18px;height:18px;margin-top:2px;accent-color:var(--primary);flex-shrink:0}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;font-size:13.5px}
.note.info{background:var(--soft-sky);color:var(--ink-2)}
.note.warn{background:var(--soft-gold);color:var(--ink-2)}
.note .i{margin-top:1px}

/* modal */
.modal{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:20px;background:rgba(10,15,20,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s}
.modal.open{opacity:1;visibility:visible}
.modal-box{width:min(680px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;background:var(--surface);border-radius:24px;box-shadow:var(--shadow-lg);transform:translateY(16px);transition:transform .35s var(--ease)}
.modal.open .modal-box{transform:none}
.modal-box.wide{width:min(900px,100%)}
.modal-box.narrow{width:min(440px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.modal-h h2{font-size:23px}
.modal-b{padding:22px 24px;overflow-y:auto}
.modal-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:20px}
.kpi{padding:20px 22px}
.kpi .lbl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:500}
.kpi .lbl .ic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;color:var(--primary)}
.kpi .val{font-family:var(--font-display);font-size:34px;line-height:1.1;margin:12px 0 6px;color:var(--ink)}
.kpi .sub{font-size:12.5px;color:var(--muted)}
.delta{display:inline-flex;align-items:center;gap:3px;font-weight:700;font-size:12px;color:var(--primary);background:var(--soft-sage);padding:2px 7px;border-radius:6px;margin-right:6px}
.spark{width:100%;height:36px;margin-top:10px;display:block}

/* up next */
.upnext{background:var(--primary);color:var(--on-primary);border:none;position:relative;overflow:hidden;display:flex;flex-direction:column}
.upnext::after{content:"";position:absolute;right:-70px;bottom:-90px;width:260px;height:260px;border-radius:50%;border:1px solid currentColor;opacity:.14}
.upnext .k{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;opacity:.8}
.upnext h3{font-size:27px;margin:10px 0 4px}
.upnext .who{display:flex;align-items:center;gap:12px;margin:18px 0}
.upnext .who .av{border:2px solid rgba(255,255,255,.4)}
.upnext .who b{display:block;font-size:15px}
.upnext .who small{font-size:13px;opacity:.8}
.upnext .unote{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 14px;font-size:13.5px}
.upnext .unote b{display:block;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.cd{display:flex;gap:10px;align-items:center;margin-top:auto;padding-top:18px;position:relative;z-index:1}
.cd .t{font-family:var(--font-display);font-size:30px;line-height:1}
.cd .t small{font-family:var(--font-sans);font-size:12px;opacity:.75;display:block;margin-top:4px}
.cd .btn{margin-left:auto}

/* schedule */
.slot{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);position:relative}
.slot:last-child{border-bottom:none}
.slot .tm{font-weight:600;font-size:13.5px}
.slot .tm small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.slot .bd{display:flex;gap:12px;align-items:center;min-width:0}
.slot .bd b{font-size:14.5px;display:block;line-height:1.35}
.slot .bd small{font-size:12.5px;color:var(--muted)}
.slot.past{opacity:.6}
.slot.next::before{content:"";position:absolute;left:-22px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.ico-box{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;color:var(--primary);background:var(--soft-sage)}

/* mini lists on overview */
.mini{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.mini:last-child{border-bottom:none}
.mini b{font-size:14px;display:block}
.mini small{font-size:12.5px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .grow{flex:1;min-width:0}
.unread-dot{width:9px;height:9px;border-radius:50%;background:var(--accent-strong);flex-shrink:0}

/* charts */
.chart-wrap{position:relative}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--ink-2);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:4px}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.5;padding:9px 12px;border-radius:12px;box-shadow:var(--shadow-md);opacity:0;transform:translate(-50%,-110%);transition:opacity .15s;white-space:nowrap;z-index:5}
.tip b{display:block;font-size:13px}
.tip .sw{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.axis text{fill:var(--muted);font-size:11.5px;font-family:var(--font-sans)}
.axis line{stroke:var(--line)}
.hb{display:grid;grid-template-columns:118px 1fr 44px;gap:12px;align-items:center;margin:11px 0;font-size:13.5px}
.hb .tr{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:99px;background:var(--chart-1);transition:width 1s var(--ease)}
.hb b{text-align:right;font-weight:600}
.tbl-toggle{font-size:12.5px;font-weight:600;color:var(--accent-strong)}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
table.dt th{text-align:left;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
table.dt td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle}
table.dt tbody tr{transition:background .15s}
table.dt tbody tr.click{cursor:pointer}
table.dt tbody tr.click:hover{background:var(--surface-2)}
table.dt tr:last-child td{border-bottom:none}
table.dt .num{text-align:right;font-variant-numeric:tabular-nums}

/* payout */
.payout{background:var(--deep);color:var(--deep-ink);border:none}
.payout .amt{font-family:var(--font-display);font-size:44px;line-height:1;color:var(--gold);margin:10px 0 4px}
.payout .row{display:flex;justify-content:space-between;font-size:13.5px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.payout .row:last-of-type{border-bottom:none}
.payout .row span{opacity:.75}

/* veda */
.mini-orb{width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;background:conic-gradient(from 0deg,var(--orb-1),var(--orb-2),var(--accent),var(--orb-1));animation:spin 5s linear infinite}
.mini-orb::after{content:"";position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.85),transparent 62%)}
@keyframes spin{to{transform:rotate(360deg)}}
.ins{display:flex;gap:12px;padding:14px;border-radius:16px;background:var(--surface-2);margin-top:10px}
.ins .n{font-family:var(--font-display);font-size:26px;line-height:1;color:var(--primary);min-width:44px}
.ins p{font-size:13.5px;color:var(--ink-2)}
.ins p b{color:var(--ink)}
.ins .btn{margin-top:10px}

/* filters bar */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-bottom:16px}
.filters .field{min-width:150px;flex:1 1 150px;max-width:280px}
.filters .field:has(.seg){flex:none;min-width:0;max-width:none}
.seg button{white-space:nowrap}
.filters .field.grow2{flex:2 1 240px;min-width:220px;max-width:none}
.filters .field > span{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.summary button{display:flex;flex-direction:column;align-items:flex-start;padding:12px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:130px;text-align:left;transition:.2s}
.summary button:hover{border-color:var(--line-strong)}
.summary button.on{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.summary b{font-family:var(--font-display);font-size:24px;line-height:1.1}
.summary small{font-size:12.5px;color:var(--muted)}

/* services */
.svc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:18px}
.svc{display:flex;flex-direction:column;gap:12px}
.svc-top{display:flex;gap:12px;align-items:flex-start}
.svc-top .ico-box{width:46px;height:46px}
.svc h3{font-size:20px}
.svc .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.svc .meta span{display:inline-flex;align-items:center;gap:6px}
.svc .price{display:flex;align-items:baseline;gap:8px}
.svc .price b{font-size:20px;color:var(--primary)}
.svc .foot{display:flex;align-items:center;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.svc .foot .grow{flex:1}
.hist{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin-top:4px}
.hist div{padding:2px 0}

/* messages */
.msg-app{display:grid;grid-template-columns:340px 1fr 300px;height:calc(100vh - 200px);min-height:560px;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:var(--shadow-sm)}
.th-col{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.th-top{padding:14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.th-tabs{display:flex;gap:6px;flex-wrap:wrap}
.search.th-search{flex:none;max-width:none;height:40px;background:var(--surface-2)}
.th-tabs::-webkit-scrollbar{display:none}
.th-tabs button{flex-shrink:0;height:30px;padding:0 11px;border-radius:99px;font-size:12.5px;font-weight:600;color:var(--ink-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:5px}
.th-tabs button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.th-tabs .n{font-size:10.5px;opacity:.8}
.th-list{overflow-y:auto;flex:1}
.th{display:flex;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left;position:relative;transition:background .15s}
.th:hover{background:var(--surface-2)}
.th.on{background:var(--soft-sage)}
.th .grow{flex:1;min-width:0}
.th .r1{display:flex;justify-content:space-between;gap:8px}
.th b{font-size:14px}
.th .tm{font-size:11.5px;color:var(--muted);white-space:nowrap}
.th p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:2px 0 6px}
.th.unread p{color:var(--ink);font-weight:500}
.th .tags{display:flex;gap:5px;flex-wrap:wrap}
.th .tags .pill{padding:2px 7px;font-size:11px}
.chat-col{display:flex;flex-direction:column;min-width:0;min-height:0}
.chat-h{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.chat-h .grow{flex:1;min-width:0}
.chat-h b{font-size:15.5px;display:block}
.chat-h small{font-size:12.5px;color:var(--muted)}
.chat-b{flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.day-l{text-align:center;font-size:11.5px;color:var(--muted);margin:6px 0}
.bub{max-width:72%;padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;position:relative;animation:fadeUp .3s var(--ease)}
.bub .t{display:block;font-size:10.5px;opacity:.65;margin-top:4px;text-align:right}
.bub.in{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;align-self:flex-start}
.bub.out{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px;align-self:flex-end}
.bub .att{display:flex;gap:10px;align-items:center;padding:8px 10px;margin-top:6px;border-radius:12px;background:rgba(127,127,127,.12)}
.bub .att .pl{width:32px;height:32px;border-radius:50%;background:var(--surface);color:var(--primary);display:grid;place-items:center;flex-shrink:0}
.sys{align-self:center;font-size:12px;color:var(--muted);background:var(--surface-2);padding:5px 12px;border-radius:99px;border:1px solid var(--line)}
.typing{align-self:flex-start;display:inline-flex;gap:4px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.quick{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px 0}
.quick button{font-size:12.5px;padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.quick button:hover{border-color:var(--primary);color:var(--primary)}
.composer{display:flex;gap:8px;align-items:flex-end;padding:12px 16px 16px}
.composer .ta{min-height:44px;height:44px;max-height:140px;border-radius:14px;padding:11px 14px}
.ctx-col{border-left:1px solid var(--line);padding:18px;overflow-y:auto}
.ctx-col h4{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 0 8px;font-family:var(--font-sans)}
.ctx-row{display:flex;gap:10px;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.ctx-row:last-child{border-bottom:none}
.ctx-row .d{color:var(--muted);width:78px;flex-shrink:0}

/* reviews */
.rv-top{display:grid;grid-template-columns:.9fr 1.1fr 1fr;gap:20px;margin-bottom:20px}
.big-rating{font-family:var(--font-display);font-size:64px;line-height:1;color:var(--ink)}
.stars{display:inline-flex;gap:2px;color:var(--gold-strong)}
.stars .i{width:16px;height:16px}
.stars .o{color:var(--line-strong)}
.dist{display:grid;grid-template-columns:28px 1fr 30px;gap:10px;align-items:center;font-size:13px;margin:7px 0}
.dist .tr{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.dist .tr i{display:block;height:100%;background:var(--gold-strong);border-radius:99px}
[data-mode="dark"] .dist .tr i{background:var(--gold)}
.dist button{text-align:left;font-weight:600}
.rv{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:20px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border-bottom:none}
.rv .r1{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.rv .r1 b{font-size:15px}
.rv .map{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.rv .map span{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:3px 9px;border-radius:8px}
.rv .body{font-size:15px;color:var(--ink);margin:6px 0}
.rv .reply{margin-top:10px;padding:12px 14px;border-radius:14px;background:var(--soft-sage);font-size:14px}
.rv .reply b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--primary);margin-bottom:4px}
.rv .acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.tag-cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag-cloud span{font-size:13px;padding:6px 12px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.tag-cloud span b{color:var(--primary);margin-left:4px}

/* profile stepper */
.pf-grid{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.stepper{position:sticky;top:96px;padding:12px}
.st{display:flex;gap:12px;align-items:center;padding:11px 12px;border-radius:14px;width:100%;text-align:left;transition:background .2s;position:relative}
.st:hover{background:var(--surface-2)}
.st.on{background:var(--soft-sage)}
.st .nb{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0;border:1.5px solid var(--line-strong);color:var(--ink-2);background:var(--surface)}
.st.ok .nb{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.st.rev .nb{background:var(--soft-gold);border-color:var(--gold-strong);color:var(--gold-strong)}
.st.act .nb{background:var(--soft-clay);border-color:var(--accent-strong);color:var(--accent-strong)}
.st b{font-size:14px;display:block}
.st small{font-size:12px;color:var(--muted)}
.pf-progress{padding:14px 12px 16px;border-bottom:1px solid var(--line);margin-bottom:8px}
.pf-progress .bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.pf-progress .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent-strong),var(--gold));border-radius:99px;transition:width .6s var(--ease)}
.pf-panel .step-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:18px}
.pf-panel h2{font-size:26px}
.pf-foot{display:flex;justify-content:space-between;gap:10px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.cred{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:16px;margin-bottom:10px}
.cred .grow{flex:1;min-width:0}
.cred b{font-size:14.5px;display:block}
.cred small{font-size:12.5px;color:var(--muted)}
.mod-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.mod-row .grow{flex:1}
.preview-card{border:1px solid var(--line);border-radius:22px;overflow:hidden}
.preview-card .cov{height:110px;background:linear-gradient(135deg,var(--orb-2),var(--primary))}
.preview-card .in{padding:0 22px 22px}

/* content */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.ct{padding:0;overflow:hidden;display:flex;flex-direction:column}
.ct .cov{height:150px;position:relative;background:linear-gradient(160deg,var(--soft-gold),var(--soft-sky));display:grid;place-items:center;color:var(--primary)}
.ct .cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ct .cov .type{position:absolute;left:12px;top:12px;z-index:1}
.ct .cov .i{width:34px;height:34px;opacity:.6}
.ct .in{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.ct h3{font-size:19px}
.ct .foot{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
.ct .foot .grow{flex:1;font-size:12.5px;color:var(--muted)}
.ev-date{width:58px;flex-shrink:0;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);text-align:center;padding:6px 0}
.ev-date small{display:block;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong)}
.ev-date b{font-family:var(--font-display);font-size:24px;line-height:1.1}

/* calendar */
.week{display:grid;grid-template-columns:56px repeat(7,minmax(100px,1fr));border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface)}
.week .dh{padding:12px 8px;text-align:center;border-bottom:1px solid var(--line);border-left:1px solid var(--line);font-size:12px;color:var(--muted)}
.week .dh b{display:block;font-family:var(--font-display);font-size:22px;color:var(--ink);font-weight:500}
.week .dh.today b{color:var(--on-primary);background:var(--primary);width:36px;height:36px;border-radius:50%;display:grid;place-items:center;margin:2px auto 0}
.week .corner{border-bottom:1px solid var(--line)}
.week .hours div{height:52px;font-size:11px;color:var(--muted);text-align:right;padding-right:8px;transform:translateY(-7px)}
.week .col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% 52px}
.ev{position:absolute;left:4px;right:4px;border-radius:10px;padding:5px 8px;font-size:11.5px;line-height:1.35;overflow:hidden;cursor:pointer;transition:transform .15s;text-align:left}
.ev:hover{transform:scale(1.02);z-index:2}
.ev b{display:block;font-size:12px}
.ev.s{background:var(--primary);color:var(--on-primary)}
.ev.g{background:var(--chart-1);color:#fffdf9}
[data-mode="dark"] .ev.g{color:#0a0f1e}
.ev.e{background:var(--chart-2);color:#fffdf9}
[data-mode="dark"] .ev.e{color:#0a0f1e}
.ev.x{background:var(--surface-2);color:var(--muted);text-decoration:line-through;border:1px solid var(--line)}
.ev.bl{background:repeating-linear-gradient(45deg,var(--surface-2) 0 8px,var(--line) 8px 9px);color:var(--muted)}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--accent);z-index:3}
.nowline::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}

/* clients */
.cl-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:20px}
.cl-item{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;cursor:pointer;transition:background .2s;width:100%;text-align:left}
.cl-item:hover{background:var(--surface-2)}
.cl-item.on{background:var(--soft-sage)}
.cl-item b{font-size:14.5px;display:block}
.cl-item small{font-size:12.5px;color:var(--muted)}
.cl-item .pill{margin-left:auto}
.tl-row{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.tl-row:last-child{border-bottom:none}
.tl-row .d{width:74px;color:var(--muted);flex-shrink:0}

/* social */
.post{display:flex;gap:14px;align-items:stretch}
.post-img{width:128px;flex-shrink:0;border-radius:16px;position:relative;overflow:hidden;background:linear-gradient(170deg,#f4ddb8,#e7b48c 55%,#5e7f6f);display:flex;align-items:flex-end;padding:10px;min-height:150px}
[data-mode="dark"] .post-img{background:linear-gradient(170deg,#2b2c63,#4a3a70 55%,#1b2448)}
.post-img::before{content:"";position:absolute;left:50%;top:22%;width:60px;height:60px;margin-left:-30px;border-radius:50%;background:#fbebc8;box-shadow:0 0 30px #fbebc8}
.post-img p{position:relative;font-family:var(--font-display);font-size:14px;line-height:1.2;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.35)}
.plats{display:flex;gap:6px;margin:8px 0}
.plat{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:10.5px;font-weight:800}

/* toast */
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,120px);background:var(--ink);color:var(--bg);padding:13px 20px;border-radius:14px;font-size:14px;box-shadow:var(--shadow-lg);z-index:200;display:flex;gap:10px;align-items:center;opacity:0;transition:transform .45s var(--ease),opacity .3s;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .i{color:var(--gold)}

/* layout grids */
.row-a{display:grid;grid-template-columns:1fr 1.35fr 1.15fr;gap:20px;margin-bottom:20px}
.row-b{display:grid;grid-template-columns:1.9fr 1fr;gap:20px;margin-bottom:20px}
.row-c{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:20px}
.scrim{display:none}

@media (max-width:1280px){
  .row-a{grid-template-columns:1fr 1fr}.row-a > :first-child{grid-column:1/-1}
  .row-c{grid-template-columns:1fr 1fr}.row-c > :first-child{grid-column:1/-1}
  .msg-app{grid-template-columns:300px 1fr}.ctx-col{display:none}
  .rv-top{grid-template-columns:1fr 1fr}.rv-top > :last-child{grid-column:1/-1}
}
@media (max-width:1024px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;width:280px;transform:translateX(-100%);transition:transform .35s var(--ease);box-shadow:var(--shadow-lg)}
  body.nav-open .side{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25}
  .ib.menu-btn{display:grid}
  .kpis{grid-template-columns:1fr 1fr}
  .row-b,.cl-grid,.pf-grid{grid-template-columns:1fr}
  .stepper{position:static}
  .me > div{display:none}
}
@media (max-width:720px){
  .top{padding:12px 16px;gap:8px}.content{padding:20px 16px 70px}
  .search:not(.th-search){display:none}
  .avail .lb{display:none}
  .row-a,.row-c,.rv-top{grid-template-columns:1fr}.row-a > :first-child,.row-c > :first-child,.rv-top > :last-child{grid-column:auto}
  .kpis{gap:12px}.kpi{padding:16px}.kpi .val{font-size:26px}
  .head h1{font-size:30px}
  .week-scroll{overflow-x:auto}.week{min-width:760px}
  .post{flex-direction:column}.post-img{width:100%}
  .fgrid{grid-template-columns:1fr}
  .msg-app{grid-template-columns:minmax(0,1fr);height:auto}.th-col{min-width:0;border-right:0}
  .chat-h{flex-wrap:wrap;padding:12px 14px;gap:10px}.chat-h .grow{flex:1 1 150px}
  .msg-app.thread-open .th-col{display:none}
  .msg-app:not(.thread-open) .chat-col{display:none}
  .chat-col{height:calc(100vh - 150px)}
  .hide-sm{display:none}
  .modal{padding:0;place-items:end center}.modal-box{border-radius:24px 24px 0 0;max-height:92vh}
}
@media (min-width:721px){.back-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.ev.pp{background:var(--soft-gold);color:var(--ink-2);border:1px dashed var(--gold-strong)}

h1,h2,h3{font-weight:600;letter-spacing:-.02em}

/* ===== theme picker (10 themes) ===== */
.tpick{position:fixed;z-index:150;width:360px;max-width:calc(100vw - 24px);max-height:calc(100vh - 90px);overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lg);padding:14px;display:none;color:var(--ink);font-family:var(--font-sans)}
.tpick.open{display:block;animation:fadeUp .25s var(--ease)}
.tpick h6{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:6px 4px 8px}
.tpick .tp-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 8px}
.tpick .tp-h b{font-size:16px;font-weight:600}
.tpick .tg-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.tpick .topt{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:10px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);text-align:left;position:relative;transition:border .2s}
.tpick .topt:hover{border-color:var(--line-strong)}
.tpick .topt.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 25%,transparent)}
.tpick .topt .chips{display:flex}
.tpick .topt .chips i{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);margin-right:-6px;display:block}
.tpick .topt b{font-size:12.5px;font-weight:600;line-height:1.2;display:block}
.tpick .topt small{font-size:11px;color:var(--muted);line-height:1.3;display:block}
.tpick .topt .tick{position:absolute;right:8px;top:8px;width:18px;height:18px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:none;place-items:center}
.tpick .topt.on .tick{display:grid}
@media (max-width:640px){.tpick{left:12px!important;right:12px!important;top:auto!important;bottom:12px;width:auto;max-height:75vh}}
[data-mode="dark"] .ev.g,[data-mode="dark"] .ev.e{color:#0a0f1e}

/* ===== location picker ===== */
.loc{display:flex;flex-direction:column;gap:12px}
.loc-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.loc-search{position:relative;flex:1;min-width:220px;display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted)}
.loc-search input{flex:1;border:none;outline:none;background:none;color:var(--ink);min-width:0;font-size:14px}
.loc-res{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:1001;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-md);padding:6px;display:flex;flex-direction:column;max-height:260px;overflow-y:auto}
.loc-res[hidden]{display:none}
.loc-res button{text-align:left;padding:9px 10px;border-radius:10px;font-size:13px;color:var(--ink)}
.loc-res button:hover{background:var(--surface-2)}
.loc-res .none{padding:10px;font-size:13px;color:var(--muted)}
.loc-map{height:300px;border-radius:18px;overflow:hidden;border:1px solid var(--line);position:relative;z-index:0;background:
  linear-gradient(var(--line) 1px,transparent 1px) 0 0/34px 34px,linear-gradient(90deg,var(--line) 1px,transparent 1px) 0 0/34px 34px,var(--surface-2)}
.loc-fallback{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:20px;color:var(--ink-2)}
.loc-fallback small{font-size:12.5px;color:var(--muted);max-width:320px}
.loc-fallback .btn{margin-top:6px}
.loc-pin{width:44px;height:44px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent-strong);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow-md);margin-bottom:6px}
.loc-pin .i{transform:rotate(45deg)}
.loc-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px}
.loc-coords{font-weight:600;color:var(--ink-2);font-variant-numeric:tabular-nums}
.loc-tznow{color:var(--muted)}
.loc .inp.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 35%,transparent);border-color:var(--accent)}
.leaflet-container{font-family:var(--font-sans)}

/* ===== Veda writing help ===== */
.vw{margin-top:6px}
.vw-bar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vw-btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 4px;border-radius:99px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600;color:var(--ink-2)}
.vw-btn:hover,.vw-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent-strong)}
.vw-orb{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,var(--orb-2),var(--orb-1) 55%,var(--orb-3));flex-shrink:0}
.vw-acts{display:inline-flex;gap:4px;flex-wrap:wrap}
.vw-acts[hidden]{display:none}
.vw-acts button{height:28px;padding:0 10px;border-radius:99px;font-size:12px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);background:var(--surface)}
.vw-acts button:hover{border-color:var(--primary);color:var(--primary)}
.vw-out{margin-top:8px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,var(--soft-clay),var(--soft-gold));padding:10px 12px;font-size:13.5px;color:var(--ink)}
.vw-out[hidden]{display:none}
.vw-h{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-strong);margin-bottom:6px}
.vw-x{font-size:18px;line-height:1;color:var(--muted);padding:0 4px}
.vw-opt{background:var(--surface);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--line)}
.vw-opt p{line-height:1.55;color:var(--ink-2)}
.vw-use{display:flex;gap:6px;margin-top:8px}
.vw-note{font-size:11.5px;color:var(--muted)}
.vw-typing{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:12.5px}
.vw-typing i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:vwb 1.2s infinite}
.vw-typing i:nth-child(2){animation-delay:.2s}.vw-typing i:nth-child(3){animation-delay:.4s;margin-right:6px}
@keyframes vwb{0%,80%,100%{opacity:.25}40%{opacity:1}}

/* ===== service creation: sections, cover, package, preparation ===== */
.sm-sec{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding-top:16px;border-top:1px solid var(--line)}
.fgrid > .sm-sec:first-child{margin-top:0;padding-top:0;border-top:none}
.sm-n{width:28px;height:28px;border-radius:50%;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-size:13px;font-weight:700;flex-shrink:0}
.sm-sec h3{font-size:17px;font-family:var(--font-sans);font-weight:600;letter-spacing:0}
.sm-sec p{font-size:13px;color:var(--muted);margin-top:2px}
.cov-wrap{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.cp-card{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-sm)}
.cp-cov{height:160px;position:relative;background:var(--surface-2)}
.cp-cov svg,.cp-cov img{width:100%;height:100%;display:block;object-fit:cover}
.cp-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:13px;background:repeating-linear-gradient(135deg,var(--surface-2) 0 12px,var(--bg-alt) 12px 24px)}
.cp-badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.55);color:#fff;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:99px}
.cp-in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.cp-in small{font-size:11.5px;color:var(--muted)}
.cp-in b{font-size:16px;font-weight:600;line-height:1.3}
.cp-price{display:flex;align-items:baseline;gap:6px;margin-top:4px}
.cp-price span{font-weight:700;font-size:17px}
.cp-pk{font-size:12px;color:var(--primary);font-weight:600;display:flex;gap:4px;align-items:center}
.cov-ctrl{display:flex;flex-direction:column;gap:10px;min-width:0}
.cov-vars{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}

.cov-var svg{width:100%;height:100%;display:block}
.cov-var.on{border-color:var(--primary);box-shadow:0 0 0 2px color-mix(in srgb,var(--primary) 30%,transparent)}
.cov-load{height:72px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--bg-alt),var(--surface-2));background-size:200% 100%;animation:shim 1.1s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.spin-s{width:14px;height:14px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;display:inline-block;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.pkg-tg{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer}
.pkg-tg input{width:20px;height:20px;accent-color:var(--primary);flex-shrink:0}
.pkg-tg b{display:block;font-size:14.5px}.pkg-tg small{font-size:12.5px;color:var(--muted)}
.pkg-tg:has(input:checked){border-color:var(--primary)}
.pkg-box{padding:16px;border-radius:16px;border:1px dashed var(--line-strong)}
.svc .cov{height:130px;margin:-22px -22px 14px;border-radius:22px 22px 0 0;overflow:hidden;position:relative;background:var(--surface-2)}
.svc .cov svg,.svc .cov img{width:100%;height:100%;object-fit:cover;display:block}
.svc .cov .cp-badge{top:10px;left:10px}
.pill.pk{background:var(--soft-gold);color:var(--gold-strong)}
/* preparation in booking */
.prep{margin-top:16px;border-radius:16px;border:1px solid var(--line);overflow:hidden}
.prep-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--surface-2);font-size:13.5px}

.prep-item.done .ck{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.prep-item.done span{color:var(--muted)}
.prep-qa{padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.prep-qa small{display:block;color:var(--muted);font-size:12px}
.hp-check{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.hp-check input{width:17px;height:17px;accent-color:var(--primary);margin-top:1px;flex-shrink:0}
.upnext .prep-s{margin-top:12px;background:rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.upnext .prep-s button{color:inherit;font-weight:600;text-decoration:underline;font-size:12.5px}
@media (max-width:720px){.cov-wrap{grid-template-columns:1fr}}
.upnext::after{pointer-events:none}.upnext .prep-s{position:relative;z-index:1}
.loc-mk{background:none;border:none}.loc-mk .loc-pin{margin:0;cursor:grab}
.modal-box{max-width:100vw}.fgrid > *,.cov-wrap > *{min-width:0}.modal-f{flex-wrap:wrap}.cov-ctrl .seg{flex-wrap:wrap}
@media (max-width:720px){.modal-f .btn{flex:1 1 auto}}

   The prototype draws a seeded SVG scene (no network). Production sends the

(function(){
  var PALS = {
    dawn:['#f4ddb8','#e7a77c','#c0704f','Ganga dawn'], ganga:['#a9c6d3','#5e8a93','#2f5358','River teal'], saffron:['#fbd9a8','#e0892e','#7a1f1f','Saffron'],
    forest:['#cfdcc2','#6e9b6a','#1f3d2b','Forest'], dusk:['#d7c5e4','#8c75a8','#3a2a5c','Dusk violet'], night:['#2b2c63','#1a2250','#e6c27a','Night sky'], rose:['#fbe1d6','#e7a08a','#8c4a4a','Rose']};

    out.push('<circle cx="' + sx.toFixed(0) + '" cy="' + sy.toFixed(0) + '" r="' + (sr * 2.2).toFixed(0) + '" fill="url(#' + id + 's)" opacity=".85"/>');
    out.push('<circle cx="' + sx.toFixed(0) + '" cy="' + sy.toFixed(0) + '" r="' + (sr * .55).toFixed(0) + '" fill="' + (dark ? '#f6e7c1' : '#fff4dc') + '" opacity=".95"/>');

function lanes(list) {
  const s = list.slice().sort((a, b) => toMin(a.time) - toMin(b.time)), out = [];
  let group = [], end = -1;
  const flush = () => { const ends = []; const g = group.map(o => { let l = ends.findIndex(e => e <= toMin(o.time)); if (l < 0) { l = ends.length; ends.push(0); } ends[l] = toMin(o.time) + o.dur; return {o, lane: l}; }); g.forEach(x => out.push({...x, n: ends.length})); group = []; };
  s.forEach(o => { const st = toMin(o.time); if (group.length && st >= end) { flush(); end = -1; } group.push(o); end = Math.max(end, st + o.dur); });
  if (group.length) flush();
  return out;
}
function occurrences(from, to){
  const out = [];
  const inR = d => d >= from && d <= to;
  S.bookings.filter(b => inR(b.date)).forEach(b => {
    const s = service(b.service);
    out.push({kind:'booking', id:b.id, date:b.date, time:b.time, dur:s.duration, cls:b.status === 'cancelled' ? 'x' : s.type === '1:1' ? 's' : 'g',
      title:s.type === '1:1' ? bLabel(b) : s.name, sub:s.type === '1:1' ? s.name : `${b.seats}/${s.capacity} booked`, b, s});
  });
  S.services.filter(s => s.status === 'active' && s.schedule.kind !== 'availability').forEach(s => {
    for (let d = from; d <= to; d = addDays(d, 1)){
      const hit = s.schedule.kind === 'weekly' ? s.schedule.days.includes(dow(d)) : s.schedule.date === d;
      if (!hit) continue;
      if (S.bookings.some(b => b.service === s.id && b.date === d)) continue;
      out.push({kind:'service', id:s.id, date:d, time:s.schedule.time, dur:s.duration, cls:'g', title:s.name, sub:'Open for booking', s});
    }
  });
  S.events.filter(e => e.status === 'Published' && inR(e.date)).forEach(e => out.push({kind:'event', id:e.id, date:e.date, time:e.time, dur:e.duration, cls:'e', title:e.title, sub:`Event · ${e.reg}/${e.cap}`, e}));
  S.blocks.filter(b => b.kind === 'instant' && inR(b.date)).forEach(b => out.push({kind:'block', id:b.id, date:b.date, time:b.time, dur:b.dur, cls:b.kind === 'instant' ? 'pp' : 'bl', title:b.label, sub:b.kind === 'instant' ? '15 min calls' : 'Blocked', bl:b}));
  return out.sort((a, b) => k(a.date, a.time).localeCompare(k(b.date, b.time)));
}
function openOccurrence(o){
  if (o.kind === 'booking') return bookingModal(o.b.id);
  if (o.kind === 'service') return serviceModal(o.s.id);
  if (o.kind === 'event') return eventModal(o.e.id);

}

  $('#v-calendar').innerHTML = `

    ${days.map(d => `<div class="col" style="height:${(stop - start) * H}px">${lanes(occ.filter(o => o.date === d)).map(({o, lane, n}) => {
      const top = (toMin(o.time) / 60 - start) * H + 2, h = Math.max(22, o.dur / 60 * H - 4);

        if (JSON.stringify(s.cover || null) !== JSON.stringify(data.cover)) changed.push('cover');

  return [
    {n:1, title:'Personal details', hint:'Name, contact, city and languages', st:P.name && P.email ? 'ok' : 'act'},
    {n:2, title:'Identity', hint:P.idStatus === 'ok' ? `Verified ${P.idDate}` : 'Document in review', st:P.idStatus},
    {n:3, title:'Practices', hint:modSt === 'act' ? 'A practice needs a certificate' : 'Each practice is verified on its own', st:modSt},
    {n:4, title:'Qualifications', hint:credMissing.length ? `Upload a certificate for ${credMissing.join(', ')}` : credRev ? 'A certificate is in review' : 'Certificates verified', st:credMissing.length ? 'act' : credRev ? 'rev' : 'ok'},
    {n:5, title:'Experience & lineage', hint:`${P.years} years · lineage ${P.lineageStatus === 'ok' ? 'confirmed' : 'in review'}`, st:P.lineageStatus},
    {n:6, title:'Your story', hint:'Bio, why people come to you, intro video', st:P.bio && P.why ? 'ok' : 'act'},

    {n:8, title:'Preview & declaration', hint:P.declared ? `Last saved ${fShort(P.lastSaved)}` : 'Confirm and publish', st:P.declared ? 'ok' : 'act'}

}

function articleModal(id){

    <label class="field"><span>Format</span><select class="sel" name="kind">${['Article','Audio','Video','PDF guide'].map(c => `<option ${c === a.kind ? 'selected' : ''}>${c}</option>`).join('')}</select></label>

    <label class="field full"><span>Tags</span><input class="inp" name="tags" value="${esc(a.tags)}" placeholder="sleep, beginners"></label></div>`,
    foot:`<button type="button" class="btn g" data-close>Cancel</button><button type="submit" class="btn g" value="draft">Save draft</button><button type="submit" class="btn p" value="publish">Publish</button>`, onOpen:b => { wireDrops(b); attachVeda(b); },

}
function eventModal(id, rerun){

    <label class="field full"><span>Event name</span><input class="inp" name="title" value="${esc(e.title)}"></label>
    <label class="field"><span>Date</span><input class="inp" type="date" name="date" value="${rerun ? '' : e.date}" min="${TODAY}"></label>
    <label class="field"><span>Start time (IST)</span><input class="inp" type="time" name="time" value="${e.time}"></label>
    <label class="field"><span>Length</span><select class="sel" name="duration">${[60,75,90,120,180,240].map(d => `<option value="${d}" ${d === e.duration ? 'selected' : ''}>${d} min</option>`).join('')}</select></label>
    <label class="field"><span>Where</span><select class="sel" name="mode">${['In person','Online'].map(m => `<option ${m === e.mode ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
    <label class="field full"><span>Venue or link</span><input class="inp" name="venue" value="${esc(e.venue)}"></label>
    <label class="field"><span>Seats</span><input class="inp" type="number" name="cap" value="${e.cap}" min="1"></label>
    <label class="field"><span>Price in India (₹)</span><input class="inp" type="number" name="inr" value="${e.inr}" min="0"></label>
    <label class="field"><span>International price ($)</span><input class="inp" type="number" name="usd" value="${e.usd}" min="0"></label>
    <div class="field"><span>Cover image</span>${drop('cover', 'Upload a cover', 'JPG or PNG', 'image/*', e.cover ? 'Current cover' : '')}</div>
    <label class="field full"><span>Description</span><textarea class="ta" name="desc" data-veda="eventdesc">${esc(e.desc)}</textarea></label></div>`,
    foot:`<button type="button" class="btn g" data-close>Cancel</button><button type="submit" class="btn g" value="draft">Save draft</button><button type="submit" class="btn p" value="publish">Publish event</button>`, onOpen:b => { wireDrops(b); attachVeda(b); },
    onSubmit:(fd, btn, f) => {
      if (!fd.get('title').trim()) return fieldErr(f, 'title', 'Add an event name');
      if (!fd.get('date') || fd.get('date') < TODAY) return fieldErr(f, 'date', 'Choose a date from today onwards');
      const cov = f.querySelector('.drop').dataset.img;
      const data = {title:fd.get('title'), date:fd.get('date'), time:fd.get('time'), duration:+fd.get('duration'), mode:fd.get('mode'), venue:fd.get('venue'), cap:+fd.get('cap'), inr:+fd.get('inr'), usd:+fd.get('usd'), desc:fd.get('desc'), status:btn === 'publish' ? 'Published' : 'Draft'};
      if (id && !rerun){ Object.assign(e, data); if (cov) e.cover = cov; }
      else S.events.push(Object.assign({id:uid('e'), reg:0, cover:cov || (rerun ? e.cover : null)}, data));
      ctTab = 'events'; commit(); toast(btn === 'publish' ? `Event published for ${fDate(data.date)}. It is on your calendar.` : 'Event saved as a draft');
    }});
}

/* =====================================================================
   Charts
   ===================================================================== */
const WEEKS = ['6 Jul','13 Jul','20 Jul','27 Jul','3 Aug','10 Aug','17 Aug','24 Aug','31 Aug','7 Sep','14 Sep','21 Sep'];
const INTL = [28,31,26,34,38,36,41,39,44,47,43,49], INDIA = [14,15,16,17,15,18,19,20,21,19,22,19];
function drawStacked(sel){
  const wrap = $(sel); if (!wrap || !wrap.offsetWidth) return;
  const W = wrap.clientWidth, H = 250, pl = 34, pr = 6, pt = 14, pb = 28, max = 80, iw = W - pl - pr, ih = H - pt - pb, n = WEEKS.length, bw = Math.min(40, iw / n * .56);
  const y = v => pt + ih - v / max * ih, c1 = css('--chart-1'), c2 = css('--chart-2');
  let s = `<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="Weekly earnings, international and India, last 12 weeks"><g class="axis">`;
  [0,20,40,60,80].forEach(v => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`; });
  s += '</g>';
  WEEKS.forEach((w, i) => {
    const cx = pl + iw / n * (i + .5), x = cx - bw / 2, a = INDIA[i], b = INTL[i], yA = y(a), yB = y(a + b);
    s += `<rect x="${x}" y="${yA + 1}" width="${bw}" height="${Math.max(0, y(0) - yA - 1)}" fill="${c2}" rx="3"/>`;
    s += `<path d="M${x} ${yA - 1} V${yB + 4} a4 4 0 0 1 4 -4 H${x + bw - 4} a4 4 0 0 1 4 4 V${yA - 1} Z" fill="${c1}"/>`;
    s += `<rect class="hit" x="${cx - iw / n / 2}" y="${pt}" width="${iw / n}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    if (i % 2 === 1 || W > 700) s += `<g class="axis"><text x="${cx}" y="${H - 8}" text-anchor="middle">${w}</text></g>`;
  });
  const L = n - 1; s += `<text x="${pl + iw / n * (L + .5)}" y="${y(INTL[L] + INDIA[L]) - 8}" text-anchor="middle" style="fill:var(--ink);font:600 12px var(--font-sans)">₹${INTL[L] + INDIA[L]}k</text></svg><div class="tip"></div>`;
  wrap.innerHTML = s;
  const tip = wrap.querySelector('.tip');
  $$('.hit', wrap).forEach(h => {
    h.addEventListener('mouseenter', () => { const i = +h.dataset.i, cx = pl + iw / n * (i + .5);
      tip.innerHTML = `<b>Week of ${WEEKS[i]}</b><span class="sw" style="background:${c1}"></span>International ₹${INTL[i]}k<br><span class="sw" style="background:${c2}"></span>India ₹${INDIA[i]}k<br>Total ₹${INTL[i] + INDIA[i]}k`;
      tip.style.left = cx + 'px'; tip.style.top = y(INTL[i] + INDIA[i]) + 'px'; tip.style.opacity = 1; h.setAttribute('fill', 'rgba(127,127,127,.08)'); });
    h.addEventListener('mouseleave', () => { tip.style.opacity = 0; h.setAttribute('fill', 'transparent'); });
  });
}
function sparks(){
  const c = css('--chart-1');
  $$('[data-spark]').forEach(svg => {
    const v = svg.dataset.spark.split(',').map(Number), mn = Math.min(...v), mx = Math.max(...v), W = 200, H = 36;
    const pts = v.map((d, i) => [i / (v.length - 1) * W, H - 4 - (d - mn) / ((mx - mn) || 1) * (H - 8)]);
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('preserveAspectRatio', 'none');
    svg.innerHTML = `<polyline points="${pts.map(p => p.join(',')).join(' ')}" fill="none" stroke="${c}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="3" fill="${c}"/>`;
  });
}
function hbars(sel, data, fmt){
  const max = Math.max(...data.map(d => d[1]));
  $(sel).innerHTML = data.map(d => `<div class="hb" title="${d[0]}: ${fmt(d[1])}"><span>${d[0]}</span><span class="tr"><i style="width:0" data-w="${d[1] / max * 100}"></i></span><b>${fmt(d[1])}</b></div>`).join('');
  requestAnimationFrame(() => $$(sel + ' .tr i').forEach(i => i.style.width = i.dataset.w + '%'));
}
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { drawStacked('#earnChart'); drawStacked('#earnChart2'); }, 150); });
